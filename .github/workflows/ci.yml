name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-integration:
    name: Unit and Linux packets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 iproute2 iptables iputils-ping
      - name: Standalone installer and unit tests
        run: |
          bash -n install-proto-cascade.sh
          bash install-proto-cascade.sh plan --file examples/rules.example.json > /dev/null
          python3 -m unittest discover -s tests -v
      - name: Isolated IPv4 and IPv6 packets
        run: sudo python3 tests/integration_linux.py

  secrets:
    name: Secrets and history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned and checksummed Gitleaks
        shell: bash
        run: |
          scan_dir=$(mktemp -d)
          trap 'rm -rf -- "$scan_dir"' EXIT
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
            --output "$scan_dir/$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$scan_dir/$archive" | sha256sum --check --status
          tar -xzf "$scan_dir/$archive" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" dir --redact --no-banner --no-color .
          "$scan_dir/gitleaks" git --redact --no-banner --no-color --log-opts='--all' .
